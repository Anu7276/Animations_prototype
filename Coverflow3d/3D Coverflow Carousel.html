<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Coverflow Carousel</title>
<style>
:root{--card-w:min(260px,58vw);--card-h:calc(var(--card-w)*1.45);--step:calc(var(--card-w)*0.52);--accent:#b3342f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#ececec 0%,#e4e4e6 38%,#6b6d73 68%,#0e1015 100%);overflow:hidden;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.scene{position:relative;width:100%;height:calc(var(--card-h) + 40px);perspective:1400px;cursor:grab;touch-action:pan-y;user-select:none}
.scene.drag{cursor:grabbing}
.card{position:absolute;left:50%;top:50%;width:var(--card-w);height:var(--card-h);margin:calc(var(--card-h)/-2) 0 0 calc(var(--card-w)/-2);border-radius:18px;overflow:hidden;transition:transform 1.3s cubic-bezier(.22,.7,.2,1),opacity 1s,filter 1s;box-shadow:0 24px 50px -18px rgba(0,0,0,.55);background:#444;will-change:transform}
.card.dragging,.scene.circle .card{transition:none}
.modes{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.modes button{border:0;background:transparent;color:rgba(255,255,255,.7);font:inherit;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .3s}
.modes button.on{background:#fff;color:#111}
.card>.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(0,0,0,.55));pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;letter-spacing:.02em;z-index:2;opacity:.9}
.dots{display:flex;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);border:0;padding:0;cursor:pointer;transition:all .3s}
.dot.on{background:var(--accent);transform:scale(1.4)}
.hint{font-size:12px;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<main class="stage">
  <div class="scene" id="scene" aria-roledescription="carousel"></div>
  <div class="dots" id="dots"></div>
  <div class="modes" id="modes"><button data-m="flow" class="on">Coverflow</button><button data-m="circle">Circle</button></div>
  <p class="hint">Drag, swipe, click a side card, or use ← →</p>
</main>
<script>
/* Swap `src` for your own image/video URL (or data: URI). Leave empty for a gradient placeholder. */
const ITEMS=[
  {title:"Lunch break",    src:"", bg:"linear-gradient(160deg,#6f9a5b,#3d5f4a 55%,#8aa6c9)"},
  {title:"Morning check-in",src:"", bg:"linear-gradient(160deg,#c9a27a,#6b4a2f 60%,#e8d9c4)"},
  {title:"Park session",   src:"", bg:"linear-gradient(160deg,#5aa0e8,#2e5f9b 55%,#d9a766)"},
  {title:"Big canvas",     src:"", bg:"linear-gradient(160deg,#f0a58a,#d9694a 45%,#e0b24d)"},
  {title:"Dough moment",   src:"", bg:"linear-gradient(160deg,#e9dcc6,#a67c52 60%,#4a3626)"},
  {title:"On the wheel",   src:"", bg:"linear-gradient(160deg,#d89a5b,#8a4f26 60%,#2f1d12)"}
];
const scene=document.getElementById('scene'),dotsEl=document.getElementById('dots');
const N=ITEMS.length;let cur=0,timer=null,paused=false;
let mode='flow',fpos=0,tw=null,last=performance.now();
const DRIFT=0.12; /* circle mode: cards per second (lower = slower) */
const cards=ITEMS.map((it,i)=>{
  const c=document.createElement('div');c.className='card';c.setAttribute('role','group');c.setAttribute('aria-label',it.title);
  c.style.background=it.bg;
  if(it.src){
    const isVid=/\.(mp4|webm)(\?|$)/i.test(it.src);
    const m=document.createElement(isVid?'video':'img');m.className='media';m.src=it.src;
    if(isVid){m.muted=true;m.loop=true;m.autoplay=true;m.playsInline=true}
    c.appendChild(m);
  }
  const cap=document.createElement('div');cap.className='cap';cap.textContent=it.title;c.appendChild(cap);
  c.addEventListener('click',()=>{if(!moved)go(i)});
  scene.appendChild(c);return c;
});
const dots=ITEMS.map((_,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Go to slide '+(i+1));d.onclick=()=>go(i);dotsEl.appendChild(d);return d});

function offset(i,pos){let d=i-pos;d=((d%N)+N)%N;if(d>N/2)d-=N;return d}
function render(pos=cur){
  const w=cards[0].offsetWidth,step=w*0.52;
  cards.forEach((c,i)=>{
    const d=offset(i,pos),a=Math.abs(d),s=Math.sign(d);
    if(mode==='circle'){
      const ang=d*360/N,R=(w*1.3)/(2*Math.tan(Math.PI/N)),f=Math.min(a,N/2)/(N/2);
      c.style.transform=`translateZ(${-R}px) rotateY(${ang}deg) translateZ(${R}px)`;
      c.style.opacity=1-f*0.55;c.style.filter=`blur(${f*3}px) brightness(${1-f*0.35})`;
      c.style.zIndex=100-Math.round(f*50);c.style.pointerEvents='auto';return;
    }
    const x=s*Math.min(a,1)*w*0.78+s*Math.max(a-1,0)*step;
    const rot=-s*Math.min(a,1.2)*38;
    const z=-Math.min(a,3)*110;
    const sc=1-Math.min(a,3)*0.06;
    c.style.transform=`translate3d(${x}px,0,${z}px) rotateY(${rot}deg) scale(${sc})`;
    c.style.opacity=a>3.2?0:Math.max(1-a*0.22,0.12);
    c.style.filter=`blur(${Math.min(a,2.5)*1.6}px) brightness(${1-Math.min(a,2)*0.12})`;
    c.style.zIndex=100-Math.round(a*10);
    c.style.pointerEvents=a>3.2?'none':'auto';
  });
  dots.forEach((d,i)=>d.classList.toggle('on',i===((Math.round(pos)%N)+N)%N));
}
function tweenTo(i){let d=((i-fpos)%N+N)%N;if(d>N/2)d-=N;tw={from:fpos,to:fpos+d,t0:performance.now(),dur:1400}}
function go(i){
  if(mode==='circle'){tweenTo(i);return}
  cur=((i%N)+N)%N;render();restart();
}
const next=()=>go(cur+1),prev=()=>go(cur-1);
function restart(){clearInterval(timer);timer=setInterval(()=>{if(!paused&&mode==='flow')next()},5500)}
function tick(now){
  const dt=now-last;last=now;
  if(mode==='circle'&&!dragging){
    if(tw){const p=Math.min((now-tw.t0)/tw.dur,1),e=1-Math.pow(1-p,3);fpos=tw.from+(tw.to-tw.from)*e;if(p>=1)tw=null}
    else if(!paused){fpos+=DRIFT*dt/1000}
    cur=((Math.round(fpos)%N)+N)%N;render(fpos);
  }
  requestAnimationFrame(tick);
}
function setMode(m){
  mode=m;tw=null;scene.classList.toggle('circle',m==='circle');
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m==='circle'){fpos=cur}else{cur=((Math.round(fpos)%N)+N)%N;render()}
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

/* drag / swipe */
let startX=0,startPos=0,dragging=false,moved=false,vpos=0;
scene.addEventListener('pointerdown',e=>{dragging=true;moved=false;startX=e.clientX;startPos=mode==='circle'?fpos:cur;vpos=startPos;tw=null;scene.classList.add('drag');cards.forEach(c=>c.classList.add('dragging'));scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{
  if(!dragging)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)moved=true;
  vpos=startPos-dx/(cards[0].offsetWidth*0.55);render(vpos);
});
function endDrag(){
  if(!dragging)return;dragging=false;scene.classList.remove('drag');cards.forEach(c=>c.classList.remove('dragging'));
  cur=((Math.round(vpos)%N)+N)%N;
  if(mode==='circle'){fpos=vpos;tweenTo(cur)}else{render();restart()}
  setTimeout(()=>moved=false,0);
}
scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);
scene.addEventListener('mouseenter',()=>paused=true);scene.addEventListener('mouseleave',()=>paused=false);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
addEventListener('resize',()=>render(mode==='circle'?fpos:cur));
render();restart();requestAnimationFrame(tick);
</script>
</body>
</html>
